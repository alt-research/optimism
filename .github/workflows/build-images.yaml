name: Build op-challenger image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build'
        required: true
        default: 'feat/op-challenger-l1-rpc-rate-limit'
      image_tag:
        description: 'Docker image tag (leave empty for <ref>-<short-sha>)'
        required: false
        default: ''

env:
  GAR_REGISTRY: us-west1-docker.pkg.dev
  GAR_REPOSITORY: shared-resources-alt/optimism
  IMAGE_NAME: op-challenger
  PLATFORMS: linux/amd64

concurrency:
  group: build-op-challenger-${{ github.event.inputs.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push op-challenger
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker "${GAR_REGISTRY}" --quiet

      - name: Compute image metadata
        id: meta
        env:
          REF_INPUT: ${{ github.event.inputs.ref }}
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail

          git_commit="$(git rev-parse HEAD)"
          git_date="$(git show -s --format='%ct' HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"

          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            image_tag="${IMAGE_TAG_INPUT}"
          else
            ref_name="${REF_INPUT#refs/heads/}"
            ref_name="${ref_name#refs/tags/}"
            safe_ref="$(printf '%s' "${ref_name}" \
              | tr '/' '-' \
              | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
            if [ -z "${safe_ref}" ]; then
              safe_ref="manual"
            fi
            image_tag="${safe_ref}-${short_sha}"
          fi

          image="${GAR_REGISTRY}/${GAR_REPOSITORY}/${IMAGE_NAME}:${image_tag}"

          {
            echo "git_commit=${git_commit}"
            echo "git_date=${git_date}"
            echo "image=${image}"
            echo "image_tag=${image_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Building ${image} from ${git_commit}"

      - name: Build and push image
        env:
          REGISTRY: ${{ env.GAR_REGISTRY }}
          REPOSITORY: ${{ env.GAR_REPOSITORY }}
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tag }}
          GIT_COMMIT: ${{ steps.meta.outputs.git_commit }}
          GIT_DATE: ${{ steps.meta.outputs.git_date }}
          GIT_VERSION: ${{ steps.meta.outputs.image_tag }}
          PLATFORMS: ${{ env.PLATFORMS }}
        run: |
          set -euo pipefail
          docker buildx bake \
            --progress plain \
            --push \
            --set op-challenger.cache-from=type=gha,scope=op-challenger \
            --set op-challenger.cache-to=type=gha,scope=op-challenger,mode=max \
            -f docker-bake.hcl \
            op-challenger

      - name: Verify pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" op-challenger --version
          docker run --rm --entrypoint cannon "${IMAGE}" --version
          docker run --rm --entrypoint kona-host "${IMAGE}" --version

      - name: Output image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          echo "## Docker image pushed" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
